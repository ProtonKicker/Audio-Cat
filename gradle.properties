# --- Build performance -------------------------------------------------------
# The whole toolchain is local, so let Gradle parallelise aggressively.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=true

# Kotlin runs its compiler in-process. The out-of-process daemon writes its
# connection marker into ~/.local/share/kotlin/daemon, which is read-only in
# this environment; in-process compilation avoids that failure entirely and is
# fast enough for a single-module project.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# --- Android -----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
